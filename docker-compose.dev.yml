services:
  postgres:
    image: postgres:16-alpine
    container_name: bot-mailer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot_mailer
      POSTGRES_USER: bot_mailer
      POSTGRES_PASSWORD: bot_mailer
    ports:
      - '5432:5432'
    volumes:
      - bot-mailer-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bot-mailer-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  bot-mailer-postgres-data:
